name: Daily job scrape

on:
  schedule:
    # 02:15 UTC = 07:45 IST, so the list is ready by 8 AM (GitHub can start scheduled runs a few minutes late)
    - cron: "15 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/data/**"
      - "**.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape jobs
        if: github.event_name != 'push'
        working-directory: scraper
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python run.py

      - name: Commit updated list
        if: github.event_name != 'push'
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily jobs update $(TZ=Asia/Kolkata date +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
